name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Validate tag
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format. Received: $TAG_NAME" >&2
            exit 1
          fi

          echo "value=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

  windows:
    name: Test and build Windows
    needs: validate
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Build NSIS installer
        id: build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./scripts/build.ps1 -Version $env:RELEASE_VERSION

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer was not found after the build."
          }

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Store Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ steps.build.outputs.installer }}
          if-no-files-found: error

  linux:
    name: Build Linux AppImage
    needs: validate
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        id: build
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash ./scripts/build.sh "$RELEASE_VERSION"
          appimage=$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

      - name: Store Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - windows
      - linux
    runs-on: ubuntu-22.04

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' installers < <(find release-assets -type f -name '*-setup.exe' -print0)
          mapfile -d '' appimages < <(find release-assets -type f -name '*.AppImage' -print0)

          if [[ ${#installers[@]} -ne 1 || ${#appimages[@]} -ne 1 ]]; then
            echo "Expected one Windows installer and one AppImage." >&2
            exit 1
          fi

          assets=("${installers[0]}" "${appimages[0]}")

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "HyperMD $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
